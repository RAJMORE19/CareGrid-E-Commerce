<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGrid Diagnostics | Patient Portal Access</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 10% 20%, #001f3f 0%, #003366 60%, #004d61 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-box {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
      text-align: center;
    }
    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      color: #003366;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 4px;
    }
    .brand-logo span { color: #00a896; }
    .tagline { color: #64748b; font-size: 13px; margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input-wrap input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #002244;
      outline: none;
      transition: 0.2s;
    }
    .input-wrap input:focus {
      border-color: #00a896;
      box-shadow: 0 0 0 3px rgba(0,168,150,0.15);
    }
    .otp-hint {
      font-size: 12px;
      color: #0d9488;
      background: #e6fffa;
      border: 1px dashed #00a896;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      text-align: left;
    }
    .btn-submit {
      width: 100%;
      background: #00a896;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 16px -2px rgba(0,168,150,0.4);
      margin-top: 4px;
    }
    .btn-submit:hover { background: #008f80; }
    .login-footer {
      margin-top: 22px;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .login-footer b { color: #003366; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand-logo">CARE<span>GRID</span> <small style="font-size:11px; color:#64748b; font-weight:400;">| DIAGNOSTICS</small></div>
    <div class="tagline">Accredited Pathology & Doorstep Health Checkups</div>

    <!-- Step 1: Mobile Number Input -->
    <div id="stepMobile">
      <div class="form-group">
        <label>Registered Patient Mobile Number</label>
        <div class="input-wrap">
          <input type="text" id="phoneInp" value="6353468394" maxlength="10">
        </div>
      </div>
      <button class="btn-submit" onclick="requestOtp()">Get Verification Code &rarr;</button>
    </div>

    <!-- Step 2: 4-Digit OTP Screen (Suggested 1111) -->
    <div id="stepOtp" style="display: none;">
      <div class="form-group">
        <label>Enter 4-Digit One-Time Password (OTP)</label>
        <div class="input-wrap">
          <input type="text" id="otpInp" value="1111" maxlength="4" placeholder="Enter OTP" style="letter-spacing: 4px; font-size: 18px; text-align: center;">
        </div>
        <div class="otp-hint">
          🔑 Auto-filled Test OTP: <b>1111</b>
        </div>
      </div>
      <button class="btn-submit" onclick="verifyOtp()">Verify & Enter Portal</button>
      <button onclick="backToMobile()" style="background:none; border:none; color:#64748b; font-size:12px; cursor:pointer; margin-top:10px; text-decoration:underline;">Change Mobile Number</button>
    </div>

    <div class="login-footer">
      <div>📞 Helpline: <b>+91 6353468394</b></div>
      <div>✉️ Support: <b>rajmore2023@gmail.com</b></div>
    </div>
  </div>

  <script>
    function requestOtp() {
      const ph = document.getElementById('phoneInp').value.trim();
      if (!ph || ph.length < 10) return;
      document.getElementById('stepMobile').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
      document.getElementById('otpInp').focus();
    }

    function verifyOtp() {
      const otp = document.getElementById('otpInp').value.trim();
      if (otp === "1111") {
        const ph = document.getElementById('phoneInp').value.trim();
        let patientName = "Raj More";
        if (ph !== "6353468394") {
          patientName = "Patient (" + ph + ")";
        }

        localStorage.setItem('caregrid_auth', 'true');
        localStorage.setItem('caregrid_user_name', patientName);
        localStorage.setItem('caregrid_user_phone', ph);

        window.location.replace('/index.html');
      } else {
        document.getElementById('otpInp').style.borderColor = '#ef4444';
      }
    }

    function backToMobile() {
      document.getElementById('stepOtp').style.display = 'none';
      document.getElementById('stepMobile').style.display = 'block';
    }

    document.getElementById('phoneInp').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') requestOtp();
    });
    document.getElementById('otpInp').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyOtp();
    });
  </script>
</body>
</html>
