apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: caregrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 466124992944.dkr.ecr.ap-south-1.amazonaws.com/caregrid/auth-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: caregrid
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
---
