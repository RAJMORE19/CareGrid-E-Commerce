apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: caregrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: 466124992944.dkr.ecr.ap-south-1.amazonaws.com/caregrid/catalog-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "caregrid"
            - name: DB_PASSWORD
              value: "secretpassword"
            - name: DB_NAME
              value: "caregrid_db"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: caregrid
spec:
  selector:
    app: catalog-service
  ports:
    - port: 5003
      targetPort: 5003
